<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>AUEC · Access Denied</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Mono:wght@400&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#0e0e0f;--paper:#f4f1eb;--rust:#8b3a2a;--muted:#6b6760;--border:#ccc8be}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Mono',monospace;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{max-width:420px;padding:48px;text-align:center}
.icon{font-size:40px;margin-bottom:20px}
h1{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;margin-bottom:10px}
p{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:24px}
a{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:11px 24px;background:var(--ink);color:var(--paper);text-decoration:none;border-radius:4px;display:inline-block}
</style>
</head>
<body>
<div class="box">
  <div class="icon">🔒</div>
  <h1>Access denied.</h1>
  <p>{{ reason }}<br/><br/>Only <strong>@ashoka.edu.in</strong> Google accounts are permitted. If you believe this is an error, contact the AUEC.</p>
  <a href="/">Return to home</a>
</div>
</body>
</html>
